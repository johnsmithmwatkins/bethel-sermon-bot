name: Test sermon thumbnail

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Optional YouTube video ID. Leave blank if using preacher_image_url only.'
        required: false
        type: string
      preacher_image_url:
        description: 'Direct URL to preacher screenshot image. Best test option.'
        required: false
        type: string
      title:
        description: 'Optional override sermon title'
        required: false
        type: string
      speaker:
        description: 'Optional override speaker name'
        required: false
        type: string
      subtitle:
        description: 'Optional subtitle, for example Part Two'
        required: false
        type: string
      style_mode:
        description: 'Optional style: purple_mountain, forest_green, blue_lake, or warm_tan. Leave blank for auto.'
        required: false
        type: choice
        options:
          - ''
          - purple_mountain
          - forest_green
          - blue_lake
          - warm_tan

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-liberation
          python3 -m pip install --user --upgrade yt-dlp "rembg[cpu]" filetype watchdog pillow onnxruntime
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          which rembg
          rembg --help >/dev/null

      - name: Install dependencies
        run: npm install

      - name: Generate test thumbnail
        run: node test-thumbnail.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
          PREACHER_IMAGE_URL: ${{ inputs.preacher_image_url }}
          TEST_TITLE: ${{ inputs.title }}
          TEST_SPEAKER: ${{ inputs.speaker }}
          TEST_SUBTITLE: ${{ inputs.subtitle }}
          STYLE_MODE: ${{ inputs.style_mode }}

      - name: Upload test thumbnail artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-thumbnail
          path: |
            test-thumbnail.jpg
            preacher-cutout.png
            ai-background.png
          if-no-files-found: warn
